<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Walk with Bunny — Character study</title>
<style>
@font-face{font-family:Garden;src:url('/assets/fonts/cormorant-garamond-latin.woff2') format('woff2');font-display:swap}
:root{font-family:Arial,sans-serif;color:#263e40;background:#95a6a3;color-scheme:light}*{box-sizing:border-box}body{margin:0}a{color:inherit;text-underline-offset:5px}a:focus-visible{outline:2px solid #263e40;outline-offset:5px}::selection{background:#e7e7ce;color:#263e40}
main{height:800px;min-width:1000px;position:relative;isolation:isolate;overflow:hidden;background:url('../finale-preview-20261118/art/ground.png') center/cover no-repeat}
header{position:absolute;top:30px;left:36px;right:36px;display:flex;justify-content:space-between;align-items:center;font:24px Garden,Georgia,serif}header a{font:14px Arial,sans-serif;text-decoration:none;padding:10px}header a:hover{text-decoration:underline}
h1{font:400 43px/1.2 Garden,Georgia,serif;margin:0;position:absolute;top:112px;left:60px;letter-spacing:0}
figure{margin:0;position:absolute;top:205px;height:470px}figure.small{left:4%;width:23%}figure.turn{left:29%;width:34%}figure.close{left:67%;width:29%}
.stage{position:absolute;inset:0 0 112px}.sprite{position:absolute;bottom:0;left:50%;width:var(--image);height:var(--image);transform:translateX(-50%)}.sprite img{width:100%;height:100%;display:block;position:absolute;bottom:calc(var(--image) * -.168)}.sprite::before{content:'';position:absolute;left:23%;right:22%;bottom:-5px;height:7%;min-height:7px;background:#42546330;border-radius:50%;filter:blur(7px);transform:rotate(-5deg)}.small .sprite{--image:125px}.turn .sprite{--image:250px}.close .sprite{--image:490px}.turn .side{left:26%}.turn .rear{left:76%}.turn .rear img{bottom:calc(var(--image) * -.178)}
.pose-label{position:absolute;bottom:-30px;width:100%;text-align:center;font:14px Arial,sans-serif;color:#2c4446}.pose-label.left{left:-24%}.pose-label.right{left:26%}
figcaption{position:absolute;top:407px;left:0;right:0;text-align:center;font:29px/1.1 Garden,Georgia,serif}figcaption span{display:block;margin-top:12px;font:14px/1.4 Arial,sans-serif;color:#2f4546}
footer{position:absolute;bottom:24px;left:36px;right:36px;display:flex;justify-content:space-between;gap:28px;font-size:12px;line-height:1.5;color:#2f4546}footer p{margin:0;max-width:560px}footer a{white-space:nowrap}
@media(min-width:1400px){main{height:900px}figure{top:265px}h1{top:135px}.close .sprite{--image:510px}}
@media(max-width:1000px){body{overflow-x:auto}header{right:36px}}
</style>
</head>
<body>
<main aria-label="The same cream bunny character at garden scale, in profile, from behind, and close up">
<header><span>Walk with Bunny</span><a href="../finale-preview-20261118/index.html">View the ending</a></header>
<h1>The same little companion.</h1>
<figure class="small"><div class="stage"><div class="sprite"><img src="./art/front.png" alt="Small cream bunny with short ears and tiny ochre eyes"></div></div><figcaption>In the garden<span>Approximate walking size</span></figcaption></figure>
<figure class="turn"><div class="stage"><div class="sprite side"><img src="./art/side.png" alt="Right-facing side view, showing one small eye"></div><div class="sprite rear"><img src="./art/back.png" alt="Rear three-quarter view, showing the same short ears and no eyes"></div><span class="pose-label left">Side</span><span class="pose-label right">Back</span></div><figcaption>When turning<span>One silhouette, different views</span></figcaption></figure>
<figure class="close"><div class="stage"><div class="sprite"><img src="./art/front.png" alt="Close view of the same cream bunny with soft dry-brushed fur"></div></div><figcaption>Up close<span>A closer look, the same bunny</span></figcaption></figure>
<footer><p>Character study · proposed views, not a gameplay capture.<br>Walking scale is estimated from the current desktop camera.</p><a href="./README.md">Art &amp; study notes</a></footer>
</main>
</body></html>
