<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>本地参考视频关键帧查看</title><style>body{font:14px sans-serif;margin:20px;background:#eee}header{margin-bottom:12px}button{padding:10px;margin:5px}section{display:flex;gap:20px}article{width:46%}video{width:100%;height:650px;background:#222;object-fit:contain}p{height:24px}</style><header>本地参考查看 · 不进入网站构建 <button data-t=".15">15% 关键帧</button><button data-t=".35">35% 关键帧</button><button data-t=".6">60% 关键帧</button><button data-t=".85">85% 关键帧</button></header><section><article><p id="a">秘密花园.qt · 读取中</p><video id="va" controls muted playsinline preload="auto" src="/reference/%E7%A7%98%E5%AF%86%E8%8A%B1%E5%9B%AD.qt"></video></article><article><p id="b">秘密花园1.qt · 读取中</p><video id="vb" controls muted playsinline preload="auto" src="/reference/%E7%A7%98%E5%AF%86%E8%8A%B1%E5%9B%AD1.qt"></video></article></section><script>for(const id of ['a','b']){const v=document.querySelector('#v'+id);v.addEventListener('loadedmetadata',()=>{document.querySelector('#'+id).textContent=v.currentSrc.split('/').at(-1)+' · '+v.duration.toFixed(1)+'s · '+v.videoWidth+'×'+v.videoHeight;v.currentTime=v.duration*.15});v.addEventListener('error',()=>document.querySelector('#'+id).textContent='浏览器无法解码该视频')}for(const button of document.querySelectorAll('button'))button.onclick=()=>{for(const v of document.querySelectorAll('video'))v.currentTime=v.duration*Number(button.dataset.t)};</script></html>
