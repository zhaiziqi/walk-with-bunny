<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>参考视频完整动作复核</title><style>body{font:15px system-ui;margin:20px;background:#eee}button,input{font:inherit;padding:8px;margin:4px}section{display:flex;gap:20px}article{width:48%}video{width:100%;height:690px;background:#222;object-fit:contain}</style><header><button id="start">两段从头播放</button><button id="pause">全部暂停</button><button id="normal">原速</button><button id="slow">半速</button><label>定位秒数 <input id="time" type="number" value="0" min="0" style="width:75px"></label><button id="seek">定位并暂停</button></header><section><article><p>秘密花园.qt <output id="a"></output></p><video id="va" controls muted playsinline preload="auto" src="/reference/%E7%A7%98%E5%AF%86%E8%8A%B1%E5%9B%AD.qt"></video></article><article><p>秘密花园1.qt <output id="b"></output></p><video id="vb" controls muted playsinline preload="auto" src="/reference/%E7%A7%98%E5%AF%86%E8%8A%B1%E5%9B%AD1.qt"></video></article></section><script>const vs=[...document.querySelectorAll('video')];for(const id of ['a','b']){const v=document.querySelector('#v'+id);v.ontimeupdate=()=>document.querySelector('#'+id).textContent=v.currentTime.toFixed(2)+' / '+v.duration.toFixed(2)+'秒'}document.querySelector('#start').onclick=()=>vs.forEach(v=>{v.currentTime=0;v.play()});document.querySelector('#pause').onclick=()=>vs.forEach(v=>v.pause());document.querySelector('#normal').onclick=()=>vs.forEach(v=>v.playbackRate=1);document.querySelector('#slow').onclick=()=>vs.forEach(v=>v.playbackRate=.5);document.querySelector('#seek').onclick=()=>vs.forEach(v=>{v.pause();v.currentTime=Math.min(v.duration,Number(document.querySelector('#time').value))});</script></html>
